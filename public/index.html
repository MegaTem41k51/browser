<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Скачать</title>
<style>
  body{font-family:system-ui;background:#1e1e2e;color:#eee;
       display:flex;flex-direction:column;align-items:center;
       justify-content:center;min-height:100vh;margin:0;gap:16px}
  a.btn{padding:14px 40px;font-size:18px;border-radius:10px;
        background:#4caf50;color:#fff;text-decoration:none}
  .admin{margin-top:40px;opacity:.6;font-size:13px}
  input,button{padding:8px;margin:4px}
</style>
</head>
<body>
  <h1>Моя программа</h1>
  <a class="btn" href="/download/program.exe" download>⬇️ Скачать</a>

  <div class="admin">
    <p>Админ: загрузить новую версию</p>
    <input type="password" id="pwd" placeholder="пароль">
    <input type="file" id="file" accept=".exe">
    <button onclick="up()">Загрузить</button>
  </div>

<script>
async function up(){
  const f = document.getElementById('file').files[0];
  const p = document.getElementById('pwd').value;
  if(!f) return alert('Выбери файл');
  const fd = new FormData();
  fd.append('file', f);
  const r = await fetch('/upload', {
    method:'POST',
    headers:{'x-password': p},
    body: fd
  });
  alert(r.ok ? 'Загружено!' : 'Ошибка: ' + await r.text());
}
</script>
</body>
</html>
